<script>
(function(){
const SS='yasuda-preview';
const b64=document.getElementById('payload').textContent.trim();
const raw=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
const salt=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28);
async function tryOpen(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:600000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct);
  const html=new TextDecoder('utf-8').decode(pt);
  try{localStorage.setItem(SS,pw);}catch(e){}
  document.open();document.write(html);document.close();
}
function showGate(){document.getElementById('load').style.display='none';document.getElementById('gate').style.display='block';}
window.addEventListener('load',async()=>{
  let saved=null;
  try{saved=localStorage.getItem(SS)||sessionStorage.getItem(SS);}catch(e){}
  if(saved){try{await tryOpen(saved);return;}catch(e){try{localStorage.removeItem(SS);sessionStorage.removeItem(SS);}catch(_){}}}
  showGate();
});
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const pw=document.getElementById('pw').value;
  document.getElementById('msg').textContent='復号しています...';
  try{await tryOpen(pw);}catch(err){document.getElementById('msg').textContent='パスワードが正しくありません。';}
});
})();
</script>
